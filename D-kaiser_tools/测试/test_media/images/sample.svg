<text x="130" y="123" font-family="monospace" font-size="13" fill="#333" stroke="white" stroke-width="2.5" paint-order="stroke">Yes (SMIL/CSS)</text>
<text x="20" y="141" font-family="monospace" font-size="13" fill="black" stroke="white" stroke-width="2.5" paint-order="stroke">Transparency:</text>
<text x="130" y="141" font-family="monospace" font-size="13" fill="#333" stroke="white" stroke-width="2.5" paint-order="stroke">Yes</text>
<text x="20" y="159" font-family="monospace" font-size="13" fill="black" stroke="white" stroke-width="2.5" paint-order="stroke">Compression:</text>
