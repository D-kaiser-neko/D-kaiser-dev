<text x="20" y="223" font-family="sans-serif" font-size="13" fill="black" stroke="white" stroke-width="2.5" paint-order="stroke">Year: 2001</text>
<text x="20" y="248" font-family="sans-serif" font-size="13" fill="black" stroke="white" stroke-width="2.5" paint-order="stroke">Purpose / Advantages:</text>
